name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: 
          - 'hello-world'
          - 'std_in_hello_world'
          - 'arrays-and-slices'
          - 'control-flow'
          - 'tuples-structs-enum'
          - 'variables'
          - 'pattern-matching'
          - 'ownership'
          - 'borrow-references'
          - 'implementations'
          - 'traits'
          - 'generics'
          - 'box-type'
          - 'vectors'
        

    steps:
    - uses: actions/checkout@v4

    - name: Build ${{ matrix.project }}
      run: cd ${{ matrix.project }} && cargo build --verbose

    - name: Run tests for ${{ matrix.project }}
      run: cd ${{ matrix.project }} && cargo test --verbose
